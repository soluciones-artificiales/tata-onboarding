    font-size: 20px; font-weight: 600;
    flex-shrink: 0;
    overflow: hidden;

  #avatar img { width: 100%; height: 100%; object-fit: cover; }

  #avatar .voz-ondas { display: flex; align-items: center; justify-content: center; gap: 3px; height: 100%; }

  #avatar .voz-ondas span:nth-child(1) { height: 10px; }
  #avatar .voz-ondas span:nth-child(2) { height: 18px; }
  #avatar .voz-ondas span:nth-child(3) { height: 27px; }
  #avatar .voz-ondas span:nth-child(4) { height: 16px; }
  #avatar .voz-ondas span:nth-child(5) { height: 9px; }

    background: rgba(255,255,255,.22);

    padding: 1px 7px;
    letter-spacing: .3px;

    padding: 14px 12px 8px;

    flex-direction: column;
    gap: 6px;

    padding: 7px 10px 5px;
    border-radius: 8px;

  .msg-row.out .bubble::before {

    border-top-color: #005c4b; border-left-color: #005c4b;

    display: inline-flex; align-items: center; justify-content: center;

    vertical-align: middle; margin-right: 8px;
  }
  .play-btn svg { width: 16px; height: 16px; fill: #fff; }
  .play-btn.playing { background: #008f6f; }

/* fetch con timeout: si la red se queda colgada, fallar en vez de "teclear" para siempre */
async function fetchTimeout(url, opts, ms) {
  var ctrl = new AbortController();
  var t = setTimeout(function () { ctrl.abort(); }, ms || 60000);
  try {
    return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
  } finally {
    clearTimeout(t);
  }
}

  const res = await fetchTimeout(SUPABASE_URL + "/functions/v1/tata-tts", {

      "Content-Type": "application/json"

    body: JSON.stringify({ text: text, device_id: getDeviceId() })
  });
  if (res.status === 402) throw budgetErr();
  if (!res.ok) throw new Error("tts " + res.status);
  return await res.blob();
}

  var words = String(n || "").trim().split(/\s+/);
  for (var i = 0; i < words.length; i++) {

    if (w && !skip.test(w)) return w.slice(0, 24);

}

  var lastErr = new Error("parabola falló");

      }, 90000);

/* Fragmentos cortos para que la voz no se degrade (anti-drift): párrafos o bloques de ~2 oraciones */
function splitParabola(text) {
  var parts = String(text).split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
  var out = [];
  parts.forEach(function (p) {
    var sentences = p.match(/[^.!?…]+[.!?…]+["”']?\s*/g) || [p];
    var buf = "";
    sentences.forEach(function (s) {
      if (buf && (buf + " " + s).trim().split(/\s+/).length > 45) { out.push(buf); buf = s.trim(); }
      else buf = (buf + " " + s).trim();
    });
    if (buf) out.push(buf);
  });
  return out.length ? out : [String(text)];
}

/* Compartir/guardar el audio de una historia. Cadena de respaldo, nunca
   silenciosa: (1) compartir el ARCHIVO si el navegador lo soporta (Web
   Share Level 2); (2) compartir el LINK del audio; (3) abrir el audio en
   una pestaña nueva para guardarlo o compartirlo desde ahí (esto es lo que
   sí funciona dentro de navegadores de apps como Instagram, donde ni el
   share de archivos ni las descargas directas responden). */
function shareParabolaAudio(audioUrl, fileName, btn) {
  fileName = fileName || "historia-de-tata.mp3";
  var label = btn ? (btn.querySelector("span") || btn) : null;
  var orig = label ? label.textContent : null;
  var restoreTimer = null;
  function done(msg) {
    try {
      if (btn) btn.disabled = false;
      if (label && msg) {
        label.textContent = msg;
        if (restoreTimer) clearTimeout(restoreTimer);
        restoreTimer = setTimeout(function () { try { label.textContent = orig; } catch (e) {} }, 4500);
      } else if (label) {
        label.textContent = orig;
      }
    } catch (e) {}
  }
  function openFallback() {
    try { window.open(audioUrl, "_blank"); } catch (e) {}
    logEvento("compartir_audio", { via: "abrir" });
    done("Se abrió el audio: desde ahí lo guardas o lo compartes");
  }
  function linkFallback() {
    if (navigator.share) {
      navigator.share({
        title: "Mi historia de Tata",
        text: "Te comparto mi historia de Tata. Escúchala aquí:",
        url: audioUrl
      }).then(
        function () { logEvento("compartir_audio", { via: "share_link" }); done(); },
        function (err) {
          if (err && err.name === "AbortError") { done(); return; }
          openFallback();
        }
      );
    } else {
      openFallback();
    }
  }
  try {
    if (label) label.textContent = "Preparando…";
    if (btn) btn.disabled = true;
    fetch(audioUrl).then(function (res) { return res.blob(); }).then(function (blob) {
      var file = null;
      try { file = new File([blob], fileName, { type: blob.type || "audio/mpeg" }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Mi historia de Tata" }).then(
          function () { logEvento("compartir_audio", { via: "share" }); done(); },
          function (err) {
            if (err && err.name === "AbortError") { done(); return; }
            linkFallback();
          }
        );
      } else {
        linkFallback();
      }
    }).catch(function () { linkFallback(); });
  } catch (e) { linkFallback(); }
}
function wireShareButton(row, blobUrl) {
  var btn = row.querySelector(".share-audio-btn");
  if (btn) btn.addEventListener("click", function () { shareParabolaAudio(blobUrl, "historia-de-tata.mp3", btn); });
}

  do { s = pick(a); guard++; } while (s === last && guard < 10);
  _lastPick[key] = s;

}

  // Estado listo ANTES del tecleo: los botones responden aunque toquen durante la animación.
  extraState = "elige-tipo";
  waitingInput = true;
  setInputEnabled(true);
  inputEl.placeholder = "Elige: venezolana o de siempre";
  showTyping();
  setTimeout(function () {
    hideTyping();
    var row = addBubble(
      escapeHtml(decirMijo(msg)) +
      '<br><button class="retry-btn qr-btn qr-ven">A lo venezolano</button> ' +
      '<button class="retry-btn qr-btn qr-siempre">De esas de siempre</button>',
      "in"
    );
    // Cableado por FILA (no por id): las burbujas viejas nunca se borran del DOM
    // y con ids duplicados el listener caía en el botón viejo, dejando el nuevo muerto.
    var bVen = row.querySelector(".qr-ven");
    var bSiempre = row.querySelector(".qr-siempre");
    if (bVen) bVen.addEventListener("click", function () { safeQuickReply("venezolana"); });
    if (bSiempre) bSiempre.addEventListener("click", function () { safeQuickReply("de esas de siempre"); });
    // showTyping() deshabilita el input: hay que re-habilitarlo o la persona
    // queda sin poder escribir (dead-end).
    setInputEnabled(true);
    waitingInput = true;
    inputEl.focus();
    // Red de seguridad anti dead-end: si en 90s no eligió, el input sigue
    // habilitado para que pueda ESCRIBIR su elección. Nunca sin salida.
    setTimeout(function () {
      if (extraState === "elige-tipo") {
        waitingInput = true;
        setInputEnabled(true);
        try { inputEl.focus(); } catch (e) {}
      }
    }, 90000);
  }, typingDelay());
}

function logConversacion(userText, tataText) {
  var mem = loadMemory();
  var conv = mem.conversacion || [];
  conv.push({ u: String(userText).slice(0, 2000), t: String(tataText).slice(0, 2000) });
  saveMemory({ conversacion: conv.slice(-20) });
}

var OTRA_RE = /otr[ao]s?\s+(par[áa]bolas?|historias?|cuentos?)|cu[ée]ntame(\s+(otra|una))?|quiero\s+(otra|una\s+(historia|par[áa]bola|cuento))|otra\s+m[áa]s|una\s+(historia|par[áa]bola|cuento|de las de siempre)/i;

/* "Repite mi historia": re-escucha la última parábola contada. Va ANTES que OTRA_RE:
   repetir no genera nada nuevo y no consume el límite de historias. */
var REPITE_RE = /(repite|repite ?me|rep[ií]teme|pon ?me|escuchar).*(historia|par[áa]bola|cuento)|la (anterior|última.*historia)/i;

/* "La misma historia pero en venezolano": re-cuenta la ÚLTIMA parábola en el
   estilo pedido. Va ANTES que REPITE_RE y OTRA_RE: si Tata promete, cumple;
   no se va por el guion. */
var RETELL_RE = /(misma|mismo)\s+(historia|par[áa]bola|cuento)|(historia|par[áa]bola|cuento)[^.?!]{0,40}\b(misma|mismo)\b|cu[ée]ntame\s+la\s+misma|la\s+misma\s+pero/i;

function pedirOtraParabola(autoTipo, forcedTipo) {
  var lista = getParabolas();
  if (lista.length >= 10) {
    waitingInput = false;
    setInputEnabled(false);
    brotherSay(decirMijo(pick(TERCERA_HISTORIA)), function () {}, null);
    return;
  }
  // El cerebro puede pedir un tipo concreto; "auto" alterna con la última contada.
  var tipo = forcedTipo || null;
  if (!tipo && autoTipo) {
    // "Otra historia" = la versión que NO le contó: alterna el tipo sin preguntar.
    var tipos = getTipos();
    var last = tipos[tipos.length - 1];
    if (!last) { pedirOtraParabola(false); return; }
    tipo = last === "venezolana" ? "para_siempre" : "venezolana";
  }
  if (tipo) {
    var msg = tipo === "venezolana"
      ? "Dale, ahora te cuento una a lo venezolano."
      : "Dale, ahora te cuento una de esas de siempre.";
    waitingInput = false;
    setInputEnabled(false);
    eligeTipoExtra = true;
    brotherSay(decirMijo(msg), function () {
      extraState = null;
      generateParabolaFlow(true, tipo);
    }, null);
    return;
  }
  waitingInput = false;
  setInputEnabled(false);
  brotherSay(decirMijo(pick(OTRA_HISTORIA)), function () {
    ofrecerTipoParabola();
  }, null);
}

/* Re-escucha la ÚLTIMA parábola contada, con su voz lista (mismo patrón del eco:
   la burbuja sale solo cuando el audio está preparado). No genera nada nuevo,
   no consume el límite de 10 historias. */
function repetirUltimaHistoria(userText) {
  var mem = loadMemory();
  var lista = (mem.parabolas && mem.parabolas.length) ? mem.parabolas : (mem.parabola ? [mem.parabola] : []);
  var firstName = cleanFirstName(mem.nombre) || "mi amor";
  waitingInput = false;
  setInputEnabled(false);
  if (!lista.length) {
    var none = "Todavía no te he contado ninguna historia, " + firstName + ". ¿Empezamos?";
    logConversacion(userText, none);
    addBubble(escapeHtml(none), "in");
    waitingInput = true;
    setInputEnabled(true);
    inputEl.focus();
    return;
  }
  showTyping();
  var last = lista[lista.length - 1];
  var intro = "Esta fue tu última historia, " + firstName + ".";
  logEvento("repite_historia", {});
  prepareParabolaVoice(last).then(function (urls) {
    hideTyping();
    logConversacion(userText, intro);
    var row = addBubble(
      escapeHtml(intro) + "<br><br>" + escapeHtml(last),
      "in",
      '<br><audio class="voice-note" controls preload="auto" src="' + urls[0] + '"></audio><br><button class="retry-btn share-audio-btn"><span>Compartir</span></button>'
    );
    wireShareButton(row, urls[0]);
    afterDesahogo();
  }).catch(function () {
    // La voz no se pudo preparar: el texto sale con botón Escuchar que genera
    // la voz y la reproduce DENTRO del gesto del tap (iOS-safe), igual que el eco.
    hideTyping();
    logConversacion(userText, intro);
    var row = addBubble(
      escapeHtml(intro) + "<br><br>" + escapeHtml(last),
      "in",
      '<br><button class="retry-btn live-voice-btn"><span>Escuchar</span></button>'
    );
    var btn = row.querySelector(".live-voice-btn");
    if (btn) btn.addEventListener("click", function () {
      btn.disabled = true;
      var label = btn.querySelector("span") || btn;
      label.textContent = "Preparando mi voz…";
      var a = new Audio();
      a.play().catch(function () {}); // dentro del gesto: iOS desbloquea el elemento
      prepareParabolaVoice(last).then(function (u2) {
        a.src = u2[0];
        a.play().catch(function () {});
        label.textContent = "Reproduciendo…";
        a.onended = function () { label.textContent = "Escuchar"; btn.disabled = false; };
        a.onerror = function () { label.textContent = "Escuchar"; btn.disabled = false; };
      }).catch(function () {
        label.textContent = "Escuchar";
        btn.disabled = false;
      });
    });
    afterDesahogo();
  });
}

/* Re-cuenta la ÚLTIMA parábola en el estilo pedido ("la misma historia pero en
   venezolano"). Usa tata-parabola en modo retell: misma historia, otro ropaje.
   Se guarda como entrada nueva con su tipo y NO consume el límite de 10. */
function retellParabola(userText, forcedTipo) {
  var mem = loadMemory();
  var lista = (mem.parabolas && mem.parabolas.length) ? mem.parabolas : (mem.parabola ? [mem.parabola] : []);
  var firstName = cleanFirstName(mem.nombre) || "mi amor";
  extraState = null;
  waitingInput = false;
  setInputEnabled(false);
  if (!lista.length) {
    var none = "Todavía no te he contado ninguna historia, " + firstName + ". ¿Empezamos con una?";
    logConversacion(userText, none);
    addBubble(escapeHtml(none), "in");
    waitingInput = true;
    setInputEnabled(true);
    inputEl.focus();
    return;
  }
  var targetTipo = forcedTipo
    || (/venezolan/i.test(userText) ? "venezolana"
    : /para\s+siempre|siempre/i.test(userText) ? "para_siempre"
    : (function () { var ts = getTipos(); var l = ts[ts.length - 1]; return l === "venezolana" ? "para_siempre" : "venezolana"; })());
  var last = lista[lista.length - 1];
  var tipoLabel = targetTipo === "venezolana" ? "a lo venezolano" : "de esas de siempre";
  var intro = "Dale, " + firstName + ", tu misma historia, ahora " + tipoLabel + ".";
  var genId = ++parabolaGenSeq;
  var statusRow = addBubble('<span class="status-text">' + escapeHtml("Dame un momentico, que estoy contando tu historia de nuevo...") + "</span>", "in");
  parabolaGen = { id: genId, since: Date.now(), statusRow: statusRow, retry: function () { retellParabola(userText); } };
  tataRetellParabola(mem.nombre, last, targetTipo).then(function (p) {
    if (!parabolaGen || parabolaGen.id !== genId) return; // reintentado desde otro lado
    deliverParabola(p, function (urls) {
      if (parabolaGen && parabolaGen.id === genId) parabolaGen = null;
      var l2 = getParabolas();
      l2.push(p);
      l2 = l2.slice(-10);
      var t2 = getTipos();
      t2.push(targetTipo);
      t2 = t2.slice(-10);
      saveMemory({ parabolas: l2, tipos: t2, parabola: p, parabolaAt: Date.now() });
      logEvento("retell", { tipo: targetTipo });
      logConversacion(userText, intro);
      var row = addBubble(
        escapeHtml(intro) + "<br><br>" + escapeHtml(p),
        "in",
        '<br><audio class="voice-note" controls preload="auto" src="' + urls[0] + '"></audio><br><button class="retry-btn share-audio-btn"><span>Compartir</span></button>'
      );
      wireShareButton(row, urls[0]);
      afterDesahogo();
    }, statusRow, function (done, total) {
      setStatusText(statusRow, "Le estoy poniendo mi voz... (" + done + " de " + total + ")");
    }, genId);
  }).catch(function () {
    if (!parabolaGen || parabolaGen.id !== genId) return;
    parabolaGen = null;
    statusRow.remove();
    var row = addBubble(
      "Tuve un problema contando tu historia de nuevo. ¿Lo intentamos?",
      "in",
      '<br><button class="retry-btn retry-retell-btn">Reintentar</button>'
    );
    logEvento("error_generacion", { donde: "retell" });
    // La persona nunca queda sin poder hablar: el input sigue habilitado.
    waitingInput = true;
    setInputEnabled(true);
    inputEl.focus();
    var bRetry = row.querySelector(".retry-retell-btn");
    if (bRetry) bRetry.addEventListener("click", function () {
      row.remove();
      retellParabola(userText);
    });
  });
}

function buildParabolaPayload(isExtra, tipo) {
  var mem = loadMemory();
  var conv = (mem.conversacion || []).map(function (m) { return "Persona: " + m.u + "\nTata: " + m.t; }).join("\n");
  var pesa = answers.que_pesa + (answers.que_extra ? "\n\nAlgo más que me contó: " + answers.que_extra : "");
  if (conv) pesa += "\n\nConversación posterior con la persona: " + conv;
  if (isExtra) {
    var anteriores = getParabolas();
    if (anteriores.length) pesa += "\n\nHistorias que YA le contaste (cuenta una DIFERENTE: otro nudo, otros personajes, otro giro):\n" + anteriores.join("\n---\n");
  }
  return { nombre: answers.nombre, que_pesa: pesa, que_quiere: answers.que_quiere, que_voz: answers.que_voz, tipo: tipo || "" };
}

/* Si la persona se abrió bastante, la historia va a ser larga: se le avisa con variación. */
var PENSANDO_LARGA = [
  "Espérame un segundito, que estoy pensando bien qué contarte que te sirva para tu caso.",
  "Dame un momentico, que estoy pensando qué historia te cuento que sea para ti.",
  "Espérame ahí un momentico, que estoy viendo qué te cuento que te sirva de verdad."
];

/* El usuario elige el tipo de cuento: venezolana o de las de para siempre. */
function handleEligeTipo(text) {
  // Si pide la misma historia en otro estilo, se hace eso (más inteligente
  // que tratarlo como una simple elección de tipo).
  if (typeof RETELL_RE !== "undefined" && RETELL_RE.test(text)) { extraState = null; retellParabola(text); return; }
  var tipo = null;
  if (/venezolan/i.test(text)) tipo = "venezolana";
  else if (/para siempre|siempre|antaño|etern/i.test(text)) tipo = "para_siempre";
  if (!tipo) {
    // Si no fue claro, lo contrario de la última para no repetir.
    var ts = getTipos();
    var l = ts[ts.length - 1];
    tipo = l === "venezolana" ? "para_siempre" : "venezolana";
  }
  extraState = null;
  waitingInput = false;
  setInputEnabled(false);
  generateParabolaFlow(eligeTipoExtra, tipo);
}

/* Si la persona da su número de WhatsApp, Tata lo anota y le confirma con variación. */
var WHATSAPP_RE = /(\+?\d[\d\s.\-()]{7,}\d)/;
var WHATSAPP_ACK = [
  "Dale, te escribo apenas pueda.",
  "Dale, mi amor, apenas pueda te escribo por ahí.",
  "Anotado. Te escribo apenas pueda."
];
function saveWhatsappBestEffort(tel) {
  saveMemory({ whatsapp: tel });
  var payload = { nombre: answers.nombre || "", que_pesa: "WHATSAPP: " + tel, que_quiere: "", que_voz: "" };
  fetchTimeout(SUPABASE_URL + "/rest/v1/tata_onboarding", {
    method: "POST",
    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify(payload)
  }).catch(function () {});
}

/* ---------- Cerebro conversacional de Tata ----------
   Todo el texto libre después del onboarding pasa por tata-chat: la función
   entiende la intención con contexto y devuelve {action, texto, tipo}.
   El cerebro manda; los regex quedan solo como respaldo si falla la red. */
var PAGE_LANG = "es"; // "en" en en/index.html

/* ---------- Guardián de presupuesto mensual ($2000 USD) ----------
   Si el servidor responde 402 (tope del mes alcanzado), Tata dice que
   necesita descansar y la acción se detiene con gracia, sin romper el chat. */
function budgetErr() { var e = new Error("presupuesto_mensual"); e.budget = true; return e; }
function isBudgetErr(e) { return !!(e && e.budget); }
function showBudgetBubble() {
  try { hideTyping(); } catch (_e) {}
  addBubble(escapeHtml(PAGE_LANG === "en"
    ? "Dear, I've talked too much this month and need to rest. Come back next month."
    : "Mijo, este mes ya hablé demasiado y necesito descansar. Vuelve el mes que viene."), "in");
  setInputEnabled(false);
  waitingInput = false;
}

async function tataChat(message, situacion) {
  var mem = loadMemory();
  var allP = (mem.parabolas && mem.parabolas.length) ? mem.parabolas : (mem.parabola ? [mem.parabola] : []);
  var allT = getTipos();
  var nP = Math.min(3, allP.length);
  var paras = [];
  for (var i = 0; i < nP; i++) {
    paras.push({ texto: String(allP[allP.length - nP + i]).slice(0, 4000), tipo: allT[allT.length - nP + i] || "" });
  }
  var flat = [];
  (mem.conversacion || []).slice(-5).forEach(function (m) {
    if (m.u) flat.push({ role: "user", text: String(m.u).slice(0, 2000) });
    if (m.t) flat.push({ role: "tata", text: String(m.t).slice(0, 2000) });
  });
  var res = await fetchTimeout(SUPABASE_URL + "/functions/v1/tata-chat", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      device_id: getDeviceId(), lang: PAGE_LANG, message: message,
      nombre: mem.nombre || "", answers: mem.answers || {},
      parabolas: paras, conversacion: flat, situacion: situacion || ""
    })
  }, 30000);
  if (res.status === 402) throw budgetErr();
  if (!res.ok) throw new Error("chat " + res.status);
  var data = await res.json();
  var action = data && data.action;
  if (["parable", "retell", "replay", "reply"].indexOf(action) === -1) throw new Error("chat acción inválida");
  var tipo = data.tipo;
  if (["auto", "venezolana", "para_siempre"].indexOf(tipo) === -1) tipo = "auto";
  return { action: action, texto: String(data.texto || "").slice(0, 2000), tipo: tipo };
}

/* Resuelve el tipo que pide el cerebro: "auto" alterna con la última contada. */
function resolveBrainTipo(tipo) {
  if (tipo === "venezolana" || tipo === "para_siempre") return tipo;
  var ts = getTipos();
  var l = ts[ts.length - 1];
  return l === "venezolana" ? "para_siempre" : "venezolana";
}

function handleBrainAction(userText, brain) {
  logEvento("chat_msg", { action: brain.action });
  if (brain.action === "parable") {
    pedirOtraParabola(true, resolveBrainTipo(brain.tipo));
  } else if (brain.action === "retell") {
    retellParabola(userText, resolveBrainTipo(brain.tipo));
  } else if (brain.action === "replay") {
    repetirUltimaHistoria(userText);
  } else {
    var texto = brain.texto || decirMijo("Te escucho, mijo. Sigue, que estoy aquí.");
    renderTataVoiceReply(userText, texto, afterDesahogo);
  }
}

/* Burbuja de Tata en el chat libre: el TEXTO sale de inmediato y la voz se
   prepara en segundo plano; el reproductor reemplaza al botón Escuchar
   cuando está listo. Antes la burbuja esperaba la voz completa y la
   respuesta tardaba el doble. */
function renderTataVoiceReply(userText, tataText, onDone) {
  logConversacion(userText, tataText);
  hideTyping();
  var row = addBubble(
    escapeHtml(tataText),
    "in",
    '<br><button class="retry-btn live-voice-btn"><span>Escuchar</span></button>'
  );
  wireLiveVoiceButton(row, tataText);
  if (onDone) onDone();
  prepareParabolaVoice(tataText).then(function (urls) {
    var btn = row.querySelector(".live-voice-btn");
    if (btn && urls && urls[0]) {
      var audio = document.createElement("audio");
      audio.className = "voice-note";
      audio.controls = true;
      audio.preload = "auto";
      audio.src = urls[0];
      btn.replaceWith(audio);
    }
  }).catch(function () { /* el botón Escuchar sigue disponible */ });
}
function handleDesahogo(text, situacion) {
  logEvento("chat_msg", { modo: "guion" });
  var telMatch = String(text).match(WHATSAPP_RE);
  if (telMatch) {
    var tel = telMatch[1].replace(/[^\d+]/g, "");
    waitingInput = false;
    setInputEnabled(false);
    showTyping();
    setTimeout(function () {
      try {
        hideTyping();
        var ack = pick(WHATSAPP_ACK);
        saveWhatsappBestEffort(tel);
        logConversacion(text, ack);
        addBubble(escapeHtml(ack), "in");
      } catch (e) {
        try { hideTyping(); } catch (_e) {}
      }
      waitingInput = true;
      setInputEnabled(true);
      try { inputEl.focus(); } catch (_e2) {}
    }, typingDelay());
    return;
  }
  waitingInput = false;
  setInputEnabled(false);
  showTyping();
  logEvento("desahogo_msg", {});
  tataChat(text, situacion || "").then(function (brain) {
    // Si el cerebro generó algo (historia / re-escucha), la oferta pendiente
    // quedó consumida; si solo conversó, la oferta sigue en pie.
    if (brain.action !== "reply") extraState = null;
    handleBrainAction(text, brain);
  }).catch(function (e) {
    if (isBudgetErr(e)) { showBudgetBubble(); logEvento("presupuesto_mensual", { donde: "chat" }); return; }
    handleDesahogoLegacy(text); // sin cerebro: el comportamiento de hoy
  });
}

/* Respaldo si tata-chat falla: regex + eco, como antes. Nunca rompe el chat. */
function handleDesahogoLegacy(text) {
  if (RETELL_RE.test(text)) { retellParabola(text); return; }
  if (REPITE_RE.test(text)) { repetirUltimaHistoria(text); return; }
  if (OTRA_RE.test(text)) { pedirOtraParabola(true); return; }
  // En el desahogo responde a lo NUEVO: contexto = conversación reciente, no todo de nuevo.
  var mem = loadMemory();
  var conv = (mem.conversacion || []).slice(-6).map(function (m) { return "Persona: " + m.u + "\nTata: " + m.t; }).join("\n");
  var ctx = "Siguen conversando después de su historia. NO resumas todo lo que te contó antes; responde SOLO a su último mensaje, con calidez, en 1-2 líneas específicas. Usa su nombre si suena natural. No abras con cariños ni fórmulas; cada respuesta suena distinta, como una conversación real, no un guion." +
    (conv ? "\nLo último que hablaron:\n" + conv : "");
    tataEco("ack", "", text, ctx).then(function (eco) {
    renderTataVoiceReply(text, eco, afterDesahogo);
  }).catch(function () {
    hideTyping();
    var fb = decirMijo("Te escucho, mijo. Sigue, que estoy aquí.");
    logConversacion(text, fb);
    addBubble(fb);
    waitingInput = true;
    setInputEnabled(true);
    inputEl.focus();
  });
}

/* Continuación del desahogo tras mostrar el eco: ofrece otra parábola
   tras 2 intercambios (una vez por historia) y re-habilita el input. */
function afterDesahogo() {
  var mem2 = loadMemory();
  var n = (mem2.desahogoCount || 0) + 1;
  var lista = getParabolas();
  if (n >= 2 && lista.length < 10 && !mem2.offeredExtra) {
    saveMemory({ desahogoCount: 0, offeredExtra: true });
    setTimeout(function () {
      showTyping();
      setTimeout(function () {
        try {
        hideTyping();
        var row = addBubble(
          escapeHtml(decirMijo(pick(OFRECE_HISTORIA))) +
          '<br><button class="retry-btn qr-btn qr-si-otra">Sí</button> ' +
          '<button class="retry-btn qr-btn qr-otra">Cuéntame otra</button>',
          "in");
        // Cableado por fila: con ids duplicados (la oferta sale tras cada historia)
        // el listener caía en botones viejos ya deshabilitados.
        var bSiOtra = row.querySelector(".qr-si-otra");
        var bOtra = row.querySelector(".qr-otra");
        if (bSiOtra) bSiOtra.addEventListener("click", function () { safeQuickReply("sí"); });
        if (bOtra) bOtra.addEventListener("click", function () { safeQuickReply("cuéntame otra historia"); });
        extraState = "ofrece-historia";
        waitingInput = true;
        setInputEnabled(true);
        inputEl.focus();
        } catch (e) {
          // La oferta nunca puede dejar el input muerto.
          try { hideTyping(); } catch (_e) {}
          waitingInput = true;
          setInputEnabled(true);
          try { inputEl.focus(); } catch (_e2) {}
        }
      }, typingDelay());
    }, 1200);
  } else {
    saveMemory({ desahogoCount: n });
    waitingInput = true;
    setInputEnabled(true);
    inputEl.focus();
  }
}
 

/* Prepara la voz completa de la parábola, con reintentos por fragmento.
   Si no se logra, falla: el texto NUNCA se muestra sin su voz lista. */
async function prepareParabolaVoice(p, onProgress) {
  var parts = splitParabola(p);
  var blobs = [];
  for (var i = 0; i < parts.length; i++) {
    if (onProgress) { try { onProgress(i, parts.length); } catch (e) {} }
    var b = null;
    for (var att = 0; att < 3 && !b; att++) {
      try { b = await tataTtsBlob(parts[i]); } catch (e) { b = null; }
    }
    if (!b) throw new Error("voz no lista");
    blobs.push(b);
  }
  if (onProgress) { try { onProgress(parts.length, parts.length); } catch (e) {} }
  // Un solo audio: los fragmentos MP3 se unen y suenan sin cortes ni pausas raras.
  return [URL.createObjectURL(new Blob(blobs, { type: "audio/mpeg" }))];
}

/* Avisos mientras se prepara la historia: la gente se desespera si no sabe que tarda un poquito. */
function setStatusText(row, text) {
  var s = row.querySelector(".status-text");
  if (s) { s.textContent = text; scrollDown(); }
}

/* Entrega la parábola: texto y voz salen JUNTOS. Si la voz no está lista, no sale el texto. */
function deliverParabola(p, onReady, statusRow, onProgress, genId) {
  if (statusRow) setStatusText(statusRow, "Ya la tengo escrita. Ahora le estoy poniendo mi voz, ya casi...");
  else showTyping();
  setInputEnabled(false);
  waitingInput = false;
  prepareParabolaVoice(p, function (done, total) {
    if (parabolaGen) parabolaGen.lastProgress = Date.now();
    if (onProgress) onProgress(done, total);
  }).then(function (urls) {
    hideTyping();
    if (statusRow) statusRow.remove();
    parabolaUrls = urls;
    try {
      onReady(urls);
    } catch (e) {
      // El onReady nunca puede dejar el input muerto: se habilita y se ofrece
      // reintentar con suavidad (igual que cuando falla la voz).
      logEvento("error_generacion", { donde: "onready" });
      waitingInput = true;
      setInputEnabled(true);
      try { inputEl.focus(); } catch (_e) {}
      try {
        var row = addBubble(
          "Tuve un problema mostrando tu historia. ¿La intentamos de nuevo?",
          "in",
          '<br><button class="retry-btn retry-onready-btn">Reintentar</button>'
        );
        var bRetryOn = row.querySelector(".retry-onready-btn");
        if (bRetryOn) bRetryOn.addEventListener("click", function () {
          row.remove();
          deliverParabola(p, onReady);
        });
      } catch (_e2) {}
    }
  }).catch(function (e) {
    hideTyping();
    if (genId && parabolaGen && parabolaGen.id === genId) parabolaGen = null;
    if (statusRow) statusRow.remove();
    if (isBudgetErr(e)) {
      showBudgetBubble();
      logEvento("presupuesto_mensual", { donde: "voz" });
      return;
    }
    var row = addBubble(
      "Tuve un problema preparando mi voz para tu historia. ¿Lo intentamos de nuevo?",
      "in",
      '<br><button class="retry-btn retry-delivery-btn">Reintentar</button>'
    );
    logEvento("error_generacion", { donde: "voz" });
    // La persona nunca queda sin poder hablar: el input sigue habilitado.
    waitingInput = true;
    setInputEnabled(true);
    inputEl.focus();
    var bRetryDel = row.querySelector(".retry-delivery-btn");
    if (bRetryDel) bRetryDel.addEventListener("click", function () {
      row.remove();
      deliverParabola(p, onReady);
    });
  });
}

/* Si iOS congela la pestaña en segundo plano, la promesa de la historia puede no
   resolverse nunca: al volver, si sigue pendiente, se ofrece reintentar. */
var parabolaGen = null; // { id, since, isExtra, tipo, statusRow }
var parabolaGenSeq = 0;
document.addEventListener("visibilitychange", function () {
  if (document.hidden || !parabolaGen) return;
  var lastActive = parabolaGen.lastProgress || parabolaGen.since;
  if (Date.now() - lastActive < 45000) return;
  var pp = parabolaGen;
  parabolaGen = null; // la promesa vieja queda huérfana y se ignora al resolver
  if (pp.statusRow) pp.statusRow.remove();
  setInputEnabled(true);
  waitingInput = true;
  var row = addBubble(
    "Se me quedó pegado pensando tu historia. ¿Lo intentamos de nuevo?",
    "in",
    '<br><button class="retry-btn retry-stuck-btn">Reintentar</button>'
  );
  var bRetryStuck = row.querySelector(".retry-stuck-btn");
  if (bRetryStuck) bRetryStuck.addEventListener("click", function () {
    row.remove();
    if (pp.retry) pp.retry();
    else generateParabolaFlow(pp.isExtra, pp.tipo);
  });
});

/* Un solo disparo por onboarding: genera, guarda en memoria y la muestra */
function generateParabolaFlow(isExtra, tipo) {
  setInputEnabled(false);
  waitingInput = false;
  var genId = ++parabolaGenSeq;
  var payload = buildParabolaPayload(isExtra, tipo);
  // Si contó bastante, la historia sale larga: se le avisa (con variación, nunca igual).
  var cuantoConto = ((answers.que_pesa || "") + (answers.que_quiere || "") + (answers.que_voz || "") + (answers.que_extra || "")).length;
  var statusText = cuantoConto > 500
    ? pickFresh(PENSANDO_LARGA, "pensando")
    : "Estoy escribiendo tu historia solo para ti, dame un momentico...";
  var statusRow = addBubble('<span class="status-text">' + escapeHtml(statusText) + "</span>", "in");
  parabolaGen = { id: genId, since: Date.now(), isExtra: isExtra, tipo: tipo, statusRow: statusRow, retry: function () { generateParabolaFlow(isExtra, tipo); } };
  tataParabola(payload).then(function (r) {
    if (!parabolaGen || parabolaGen.id !== genId) return; // reintentado desde otro lado
    var p = r.p;
    deliverParabola(p, function (urls) {
      if (parabolaGen && parabolaGen.id === genId) parabolaGen = null;
      var lista = getParabolas();
      lista.push(p);
      lista = lista.slice(-10);
      var tipos = getTipos();
      tipos.push(tipo || "");
      tipos = tipos.slice(-10);
      saveMemory({ parabolas: lista, tipos: tipos, parabola: p, parabolaAt: Date.now(), desahogoCount: 0, offeredExtra: false });
      logEvento("parabola_generada", { tipo: tipo || "", variant: r.variant, molde: r.molde || "" });
      showParabolaBubble(p, urls && urls[0]);
      setTimeout(function () { showClosingSequence(lista.length); }, 1200);
    }, statusRow, function (done, total) {
      setStatusText(statusRow, "Le estoy poniendo mi voz... (" + done + " de " + total + ")");
    }, genId);
  }).catch(function (e) {
    if (!parabolaGen || parabolaGen.id !== genId) return;
    parabolaGen = null;
    try { statusRow.remove(); } catch (_x) {}
    if (isBudgetErr(e)) {
      showBudgetBubble();
      logEvento("presupuesto_mensual", { donde: "parabola" });
      return;
    }
    var row = addBubble(
      "Tuve un problema escribiendo tu historia. ¿Lo intentamos de nuevo?",
      "in",
      '<br><button class="retry-btn retry-parabola-btn">Reintentar</button>'
    );
    logEvento("error_generacion", { donde: "parabola" });
    // La persona nunca queda sin poder hablar: el input sigue habilitado.
    waitingInput = true;
    setInputEnabled(true);
    inputEl.focus();
    var bRetryPar = row.querySelector(".retry-parabola-btn");
    if (bRetryPar) bRetryPar.addEventListener("click", function () {
      row.remove();
      generateParabolaFlow(isExtra, tipo);
    });
  });
}

/* ---------- Eco de Tata: acknowledgment empático tras cada respuesta ---------- */
async function tataEco(modo, pregunta, ultima, ctxOverride) {
  var ctx = ctxOverride || ("Qué le pesa: " + (answers.que_pesa || "(no dijo)") +
    "\nQué quiere: " + (answers.que_quiere || "(no dijo)") +
    "\nQué voz le dice que no puede: " + (answers.que_voz || "(no dijo)"));
  const res = await fetchTimeout(SUPABASE_URL + "/functions/v1/tata-eco", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ modo: modo, nombre: answers.nombre, pregunta: pregunta || "", ultima: ultima || "", contexto: ctx, device_id: getDeviceId() })
  });
  if (!res.ok) throw new Error("eco " + res.status);
  var data = await res.json();
  var t = data && data.texto ? String(data.texto).trim() : "";
  if (!t) throw new Error("eco vacío");
  return t;
}

let extraState = null; // "ofrece-historia" | "elige-tipo"
var NO_RE = /^\s*(no|nah|nop|para nada|creo que no|estoy bien|ya estoy|listo|no,?\s*gracias)/i;
var YES_SHORT_RE = /^\s*(s[ií]+|sip?|claro( que s[ií]+)?|dale|bueno|vale|obvio|de una|por supuesto)\.?!?\s*$/i;

function proceedToParable(withThanks) {
  extraState = null;
  finished = true;
  setInputEnabled(false);
  waitingInput = false;
  inputEl.placeholder = "Conversación terminada";
  var msg = withThanks
    ? "Gracias por contarme eso también, " + tratoMijo() + ". " + decirMijo(pick(ESPERAME))
    : decirMijo(pick(ESPERAME));
  brotherSay(msg, function () {
    setInputEnabled(false);
    waitingInput = false;
    ofrecerTipoParabola(false);
  }, null);
}

function handleExtraState(text) {
  waitingInput = false;
  setInputEnabled(false);
  if (extraState === "ofrece-historia" && OTRA_RE.test(text)) {
    // "Cuéntame otra": va directo a la versión que NO le contó (alterna el tipo).
    extraState = null;
    pedirOtraParabola(true);
  } else if (extraState === "ofrece-historia" && /venezolan/i.test(text)) {
    // "Sí, venezolana": va directo sin preguntar de nuevo.
    extraState = null;
    eligeTipoExtra = true;
    generateParabolaFlow(true, "venezolana");
  } else if (extraState === "ofrece-historia" && /siempre/i.test(text)) {
    extraState = null;
    eligeTipoExtra = true;
    generateParabolaFlow(true, "para_siempre");
  } else if (extraState === "ofrece-historia" && YES_SHORT_RE.test(text)) {
    extraState = null;
    pedirOtraParabola(false);
  } else if (extraState === "ofrece-historia" && NO_RE.test(text)) {
    extraState = null;
    brotherSay(decirMijo("Está bien, mijo. Aquí sigo para lo que necesites."), function () {
      waitingInput = true;
      setInputEnabled(true);
      inputEl.focus();
    }, null);
  } else if (extraState === "ofrece-historia") {
    // Respuesta ambigua: el cerebro la entiende con contexto (sabe que hay
    // una oferta pendiente). Si solo conversa, la oferta sigue en pie.
    handleDesahogo(text, "ofrece-historia");
  } else if (extraState === "elige-tipo") {
    handleEligeTipo(text);
  } else {
    answers.que_extra = ((answers.que_extra ? answers.que_extra + "\n" : "") + text).slice(0, 8000);
    saveMemory({ que_extra: answers.que_extra });
    proceedToParable(true);
  }
}

/* ---------- Ritmo humano: siempre 1-2s "tecleando" ---------- */
function typingDelay() { return 1000 + Math.random() * 1000; }
function typingDelaySlow() { return 2600 + Math.random() * 900; }

function brotherSay(text, then, audioSrc, slow) {
  showTyping();
  setTimeout(function () {
    try {
      hideTyping();
      var row = addBubble((audioSrc ? PLAY_SVG : "") + escapeHtml(text), "in");
      if (audioSrc) wirePlayButton(row, audioSrc);
      setInputEnabled(true);
      waitingInput = true;
      if (then) then();
    } catch (e) {
      // Nunca dejar el input muerto por una excepción al mostrar el mensaje.
      try { hideTyping(); } catch (_e) {}
      setInputEnabled(true);
      waitingInput = true;
      try { if (then) then(); } catch (_e2) {}
    }
  }, slow ? typingDelaySlow() : typingDelay());
}

/* Al volver: re-vocea la última historia guardada, con guardián y progreso. */
function revoiceLastStory() {
  var lista = getParabolas();
  if (!lista.length) { startConversation(); return; }
  var last = lista[lista.length - 1];
  var genId = ++parabolaGenSeq;
  var statusRow = addBubble('<span class="status-text">Le estoy poniendo mi voz a tu historia, ya casi...</span>', "in");
  parabolaGen = { id: genId, since: Date.now(), statusRow: statusRow, retry: function () { revoiceLastStory(); } };
  deliverParabola(last, function (urls) {
    if (parabolaGen && parabolaGen.id === genId) parabolaGen = null;
    showParabolaBubble(last, urls && urls[0]);
    // El follow-up completo también al volver: las 4 burbujas (incluye lo del beta).
    setTimeout(function () { showClosingSequence(lista.length); }, 1200);
  }, statusRow, function (done, total) {
    setStatusText(statusRow, "Le estoy poniendo mi voz... (" + done + " de " + total + ")");
  }, genId);
}

/* Al volver: re-renderiza los últimos intercambios guardados para que la
   conversación no se vea vacía. Solo texto, sin botones de voz. */
function renderHistory() {
  var mem = loadMemory();
  var conv = mem.conversacion || [];
  if (!conv.length) return;
  conv.slice(-10).forEach(function (m) {
    if (m.u) addBubble(escapeHtml(String(m.u)), "out");
    if (m.t) addBubble(escapeHtml(String(m.t)), "in");
  });
}

/* ---------- Brazo MODELO: un solo modelo conversa de principio a fin ----------
   Sin pasos ni frases fijas: cada mensaje va a tata-modelo, que carga la
   memoria en el servidor, conversa, dispara la primera parábola cuando ya
   conoce a la persona y guarda todo antes de responder. */
var modeloBusy = false;
/* Sincroniza con el servidor conservando la conversación más larga: la del
   servidor manda cuando un turno se completó allá y la respuesta se perdió;
   la local manda cuando ya incluye la parábola pintada en su sitio. */
function restaurarModelo(done) {
  var antes = null;
  try { antes = loadMemory(); } catch (e) {}
  restoreFromServer(function () {
    try {
      var despues = loadMemory();
      var convAntes = (antes && antes.conversacion) || [];
      var convDespues = despues.conversacion || [];
      if (convAntes.length > convDespues.length) {
        despues.conversacion = convAntes;
        var json = JSON.stringify(despues);
        try { localStorage.setItem(MEM_KEY, json); } catch (e) {}
        try { sessionStorage.setItem(MEM_KEY, json); } catch (e) {}
      }
    } catch (e) {}
    done();
  });
}
/* Si la última parábola guardada no está pintada en la conversación (el
   servidor la guarda aparte), la muestra al final con su botón de voz. */
function mostrarParabolaGuardada() {
  try {
    var mem = loadMemory();
    var ps = mem.parabolas || [];
    if (!ps.length) return;
    var ultima = String(ps[ps.length - 1]);
    var conv = mem.conversacion || [];
    var ya = conv.some(function (m) { return m && typeof m.t === "string" && m.t.indexOf(ultima.slice(0, 60)) >= 0; });
    if (ya) return;
    var row = addBubble(escapeHtml(ultima), "in",
      '<br><button class="retry-btn live-voice-btn"><span>Escuchar</span></button>');
    wireLiveVoiceButton(row, ultima);
  } catch (e) {}
}
/* Arranque de la anónima: no dispara turno al servidor al abrir. Su
   presentación es el saludo en audio con la voz de Vesper (archivo del

}

/* La anónima DA PRIMERO y pide el teléfono DESPUÉS del primer intercambio
   (decisión de Diego, 2026-10-21; revierte el pedido de una del 2026-10-20:
   en 48 h, 57 de 70 personas no escribieron ni una palabra, y el precipicio

var pedidoTelefonoMostrado = false;
function quizasPedirTelefonoTrasIntercambio() {

function mostrarPedidoTelefono() {

    + '<button type="submit" class="tlf-send" style="padding:9px 14px;border-radius:8px;border:none;background:#128C7E;color:#fff;font-size:15px;font-weight:600">Sí, pueden escribirme</button>'

    + '<div class="tlf-msg" style="flex-basis:100%;font-size:13px"></div></form>';

async function enviarTelefonoAnonima(row) {
  var input = row.querySelector(".tlf-input");
  var msg = row.querySelector(".tlf-msg");
  var btn = row.querySelector(".tlf-send");

  if (digitos.length < 7 || digitos.length > 15) {
    if (msg) msg.textContent = "Ese número no se ve completo. Revísalo, o sigue aquí sin WhatsApp.";
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = "Enviando..."; }
  try {
    var res = await fetchTimeout(SUPABASE_URL + "/functions/v1/tata-telefono", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ telefono: digitos, lang: PAGE_LANG, device_id: getDeviceId() })
    }, 15000);
    if (!res.ok) throw new Error("telefono " + res.status);
    logEvento("telefono_capturado", { variante: TATA_VARIANTE, consentimiento: "contacto-equipo-tata-v1" });
    saveMemory({ anonima_tlf_estado: "capturado" });

    logEvento("telefono_error", { variante: "anonima" });

    if (btn) { btn.disabled = false; btn.textContent = "Enviar"; }
  }
}
function omitirTelefonoAnonima(row) {
  logEvento("telefono_omitido", { variante: "anonima" });
  saveMemory({ anonima_tlf_estado: "omitido" });

function startModelo() {
  logEvento("page_open", { modo: "modelo", variante: TATA_VARIANTE, release: "wonder-2026-10-21" });
  renderHistory();
  mostrarParabolaGuardada();
  inputEl.placeholder = "Cuéntame qué necesitas…";
  setInputEnabled(true); waitingInput = true;
  var mem = loadMemory();
  if (!mem.conversacion || !mem.conversacion.length) mostrarSaludoAnonima();
  // No model call, microphone permission, login or server round trip blocks first input.
  var pending = leerTurnoPendiente();
  if (pending) {
    if (!pending.displayed && pending.message) addBubble(escapeHtml(pending.message), "out", "");
    mostrarReintentoModelo("Tu último mensaje sigue pendiente. Puedes retomarlo sin volver a escribirlo.");
  }
  modeloCola.forEach(function(text){addBubble(escapeHtml(text),"out","");});
  if (!pending && modeloCola.length) procesarColaModelo();
  syncMicSend();
  if (!restoreAttempted) restoreFromServer(function () {
    if (modeloBusy || leerTurnoPendiente() || modeloCola.length) return;
    var restored = loadMemory();
    if (restored.conversacion && restored.conversacion.length) {
      messagesEl.innerHTML = ""; renderHistory(); mostrarParabolaGuardada();
    }
  });
}

/* La persona puede seguir escribiendo mientras Tata piensa, como en un chat
   de verdad: los mensajes se encolan y se procesan en orden, en lotes.
   El input NUNCA se bloquea en este brazo. */
var modeloCola = [];
var PENDING_KEY = "tata-pending-turn-v2";
try { modeloCola = JSON.parse(localStorage.getItem("tata-modelo-queue-v2") || "[]"); if (!Array.isArray(modeloCola)) modeloCola = []; } catch(e) {}
function guardarColaModelo() { try { localStorage.setItem("tata-modelo-queue-v2", JSON.stringify(modeloCola)); } catch(e) {} }
function leerTurnoPendiente() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); } catch(e) { return null; } }
function guardarTurnoPendiente(p) { try { if (p) localStorage.setItem(PENDING_KEY,JSON.stringify(p)); else localStorage.removeItem(PENDING_KEY); } catch(e) {} }
function uuidTurno() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g,function(c){return (Number(c)^crypto.getRandomValues(new Uint8Array(1))[0]&15>>Number(c)/4).toString(16);});
}
function handleModelo(text) {
  try { localStorage.removeItem("tata-draft-v2"); } catch(e) {}
  logEvento("chat_msg", { modo: "modelo", release: "wonder-2026-10-21" });
  modeloCola.push(text); guardarColaModelo(); procesarColaModelo();
}
function procesarColaModelo() {
  if (modeloBusy || leerTurnoPendiente() || !modeloCola.length) return;
  var lote = modeloCola.join("\n");

function modeloTurno(textoUsuario, pending) {
  if (modeloBusy) return;

  },150000).then(function(res){
    return res.json().then(function(data){ if (!res.ok) { var e = new Error(data.error || "servicio_no_disponible"); e.code=data.error; throw e; } return data; });
  }).then(function(data){
    hideTyping(); modeloBusy=false;
    // Render once even if the answer arrives before its memory commit acknowledgement.
    if (!pending.displayed && data.texto) {

      if(data.parabola){

        wireLiveVoiceButton(prow,p);logConversacion("",p);
        var m=loadMemory();var ps=m.parabolas||[]; if(ps.indexOf(p)<0)ps.push(p);
        saveMemory({parabolas:ps.slice(-10),nombre:data.nombre||m.nombre||""});
      } else if(data.nombre)saveMemory({nombre:data.nombre});
      pending.displayed=true;guardarTurnoPendiente(pending);
      logEvento("modelo_respuesta_visible",{ms:Date.now()-began,release:"wonder-2026-10-21"});
    }
    if(data.memory_saved===false){
      logEvento("memoria_guardado_pendiente",{release:"wonder-2026-10-21"});
      mostrarReintentoModelo("La respuesta llegó, pero su guardado sigue pendiente. Conservamos el mensaje aquí para reintentarlo.");
      return;
    }
    guardarTurnoPendiente(null);
    logEvento("memoria_guardada",{release:"wonder-2026-10-21",confirmada:data.memory_saved===true});
    quizasPedirTelefonoTrasIntercambio(); procesarColaModelo();
  }).catch(function(e){

    logEvento("modelo_error",{code:String(e.code||"conexion"),ms:Date.now()-began,release:"wonder-2026-10-21"});

      e.code==="uncertain" ? "Estamos comprobando el último envío para no repetirlo. Tu mensaje sigue aquí." :
      "No pudimos completar este envío. Tu mensaje sigue guardado aquí; no necesitas volver a escribirlo.");

function startConversation() {
  if (MODO_MODELO) { startModelo(); return; }
  var mem = loadMemory();
  if (!mem.nombre && !restoreAttempted) {
    // Sin memoria local: puede ser un dispositivo conocido con los datos borrados.
    // Se intenta restaurar del servidor y se sigue el flujo normal con lo que haya.
    restoreFromServer(function () { startConversation(); });

  }
  logEvento("page_open", { modo: "guion" });
  var firstName = cleanFirstName(mem.nombre) || "mi amor";
  // Continuidad genuina: los últimos intercambios vuelven a verse antes del saludo.
  renderHistory();
  var lista = (mem.parabolas && mem.parabolas.length) ? mem.parabolas : (mem.parabola ? [mem.parabola] : []);
 
  if (lista.length) {
    // Ya tiene su historia: la saluda, se la muestra y sigue aprendiendo de la persona.
    var a0 = mem.answers || {};
    answers.nombre = mem.nombre || "";
    answers.que_pesa = a0.que_pesa || "";
    answers.que_quiere = a0.que_quiere || "";

      revoiceLastStory();
    }, null);

    // Terminó el onboarding pero la historia no se generó: la generamos ahora.
    var a = mem.answers || {};
    answers.nombre = mem.nombre;
    answers.que_pesa = a.que_pesa || "";
    answers.que_quiere = a.que_quiere || "";
    answers.que_voz = a.que_voz || "";

    try { addBubble(escapeHtml("Hola " + firstName + ". Vamos a terminar tu historia."), "in"); } catch (e) {}
    ofrecerTipoParabola(false);
  } else if (mem.nombre) {

    answers.nombre = mem.nombre;

/* Secuencia de burbujas de Tata, a prueba de excepciones: si cualquier paso
   falla, se salta al final y el input SIEMPRE vuelve a habilitarse. Un guardián
   por tiempo lo fuerza si la secuencia se tranca a mitad de camino. */
function brotherSaySeq(items, then) {
  setInputEnabled(false);
  waitingInput = false;
  var done = false;
  function finish() {
    if (done) return;
    done = true;
    try { hideTyping(); } catch (e) {}
    setInputEnabled(true);
    waitingInput = true;
    try { if (then) then(); } catch (e) {}
  }
  // Guardián: (items.length * 8000 + 15000)ms sin completar -> forzar habilitación.
  setTimeout(function () { finish(); }, (items.length * 8000) + 15000);
  function next(i) {
    if (done) return;
    if (i >= items.length) { finish(); return; }
    try { showTyping(); } catch (e) {}
    setTimeout(function () {
      if (done) return;
      try {
        hideTyping();
        var row = addBubble((items[i].audio ? PLAY_SVG : "") + escapeHtml(items[i].text), "in");
        if (items[i].audio) wirePlayButton(row, items[i].audio);
      } catch (e) {
        finish(); // un paso roto no tranca la conversación
        return;
      }
      setTimeout(function () { next(i + 1); }, 600);
    }, typingDelay());
  }
  try { next(0); } catch (e) { finish(); }
}

var QUESTION_AUDIO = [null, "t4.mp3", "t5.mp3", "t6.mp3"];
/* Empujón cálido si no responde a una pregunta difícil: varía siempre, nunca la misma frase. */
var NUDGES = [
  "Me puedes contar hasta donde tú quieras, pero mientras más me cuentes, más te voy a poder ayudar.",
  "Cuéntame hasta donde te provoque, mijo, que mientras más me cuentes, mejor te puedo ayudar.",
  "No te apures, cuenta hasta donde quieras. Mientras más me cuentes, más te puedo ayudar.",
  "Tómate tu tiempo, mijo. Mientras más me cuentes, más te voy a poder ayudar."
];

/* 4 segundos después de una pregunta difícil, si aún no respondió: empujón cálido con voz en vivo */
function scheduleNudge() {
  var s = step;
  setTimeout(function () {
    if (finished || !waitingInput || step !== s) return;
    var nudge = decirMijo(pick(NUDGES));
    showTyping();
    setTimeout(function () {
      tataTtsUrl(nudge).then(function (url) {
        if (finished || step !== s) { hideTyping(); return; }
        hideTyping();
        var row = addBubble(PLAY_SVG + escapeHtml(nudge), "in");
        wirePlayButton(row, url);
        setInputEnabled(true);
        waitingInput = true;
      }).catch(function () {
        if (finished || step !== s) { hideTyping(); return; }
        hideTyping();
        addBubble(escapeHtml(nudge), "in");
        setInputEnabled(true);
        waitingInput = true;
      });
    }, typingDelay());
  }, 4000);
}

function askQuestion(i) {
  var slow = (i === 1); // "¿Qué te pesa ahorita?" se escribe lento, deliberado
  brotherSay(QUESTIONS[i], function () {

/* Si pregunta "¿ayudar con qué?": misterio, sin avanzar el paso */

}

// La función tata-eco desplegada todavía cierra el resumen con la pregunta
// vieja "¿quieres contarme algo más?". Hasta que se redespliegue, el frontend

function stripResumenPreguntaExtra(texto) {
  return String(texto || "").replace(/¿[^?]{0,150}algo m[áa]s[^?]{0,150}\?\s*$/i, "").trim();
}

function finishConversation() {
  logEvento("onboarding_fin", {});
  showTyping();
  var firstName = cleanFirstName(answers.nombre) || "mi cielo";
  var resumenFallback = "Bueno, " + firstName + ", ya me contaste lo que te pesa, lo que quieres de verdad y esa voz que te dice que no puedes. Ahora déjame contarte tu historia, dame un momentico.";
  saveAnswers().then(function () {
    saveMemory({ answers: { nombre: answers.nombre, que_pesa: answers.que_pesa, que_quiere: answers.que_quiere, que_voz: answers.que_voz, que_extra: answers.que_extra }, finishedAt: Date.now() });
    // Resumen empático de todo lo contado; cierra anunciando la historia (sin preguntas).
    tataEco("resumen", null, null).then(function (texto) {
      showResumenStep(stripResumenPreguntaExtra(texto) || resumenFallback);
    }).catch(function () {

    });

function submitAnswer(text) {
  if (MODO_MODELO) { handleModelo(text); return; }
  if (!waitingInput) { guionCola.push(text); return; }
  if (extraState) { handleExtraState(text); return; }
  if (telefonoMode) { handleTelefonoAnswer(text); return; }
  if (desahogoMode) { handleDesahogo(text); return; }
  if (finished) return;
  waitingInput = false;
  setInputEnabled(false);
  var key = answerKeys[step];
  answers[key] = text;
  step++;
  if (step < QUESTIONS.length) {
    if (step === 1) {
      // Después del nombre: Tata lo saluda con SU VOZ, generada en vivo con su nombre.
      saveMemory({ nombre: answers.nombre });
      var firstName = cleanFirstName(answers.nombre) || "mi amor";
      var greeting = "Hola " + firstName + ", " + endear() + ".";
      setTimeout(function () {
        showTyping(); // teclea mientras se genera el audio
        tataTtsUrl(greeting).then(function (url) {
          hideTyping();
          sayGreetingSeq(greeting, url);
        }).catch(function () {
          // Si la voz viva falla, el saludo sale como texto y el flujo sigue igual.
          hideTyping();
          sayGreetingSeq(greeting, null);
        });
      }, 350);
    } else {
      // Eco empático: Tata muestra que entendió antes de la siguiente pregunta.
      // Nunca se salta: si el eco falla, reintenta una vez y si no, sale un respaldo cálido local.
      var qAsked = QUESTIONS[step - 1], ansGiven = text;
      setTimeout(function () {
        showTyping();
        function showEco(eco) {
          hideTyping();
          var row = addBubble(
            escapeHtml(eco),
            "in",
            '<br><button class="retry-btn live-voice-btn"><span>Escuchar</span></button>'
          );
          wireLiveVoiceButton(row, eco);
          setTimeout(function () { askQuestion(step); }, 700);
        }
        function ecoFallback() {
          var fn = cleanFirstName(answers.nombre);
          showEco("Ay" + (fn ? " " + fn : "") + ", " + endear() + ", qué fuerte lo que me estás contando. Te escucho, de verdad te escucho.");
        }
        tataEco("ack", qAsked, ansGiven).then(showEco).catch(function () {
          tataEco("ack", qAsked, ansGiven).then(showEco).catch(ecoFallback);
        });
      }, 350);
    }
  } else {
    setTimeout(finishConversation, 350);
  }
}

function onSend() {
  const text = inputEl.value.trim();
  if (!text) return;
  addBubble(escapeHtml(text), "out");
  inputEl.value = "";

  if (!MODO_MODELO && HELP_Q_RE.test(text) && waitingInput && !telefonoMode && !desahogoMode && !extraState) { answerHelpQuestion(); return; }
  enviarOEncolar(text);
}

/* ---------- Notas de voz del usuario ---------- */
let mediaRecorder = null, audioChunks = [], recTimer = null, recSecs = 0, recStream = null, isRecording = false, recWanted = false;

function fmtTime(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function syncMicSend() {
  var has = inputEl.value.trim().length > 0;
  sendBtn.style.display = has ? "" : "none";
  micBtn.style.display = has ? "none" : "";
}

async function startRecording() {
  if (isRecording) return;
  if (!waitingInput || (finished && !desahogoMode && !extraState)) return;
  recWanted = true; // el dedo está pegado
  var stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    recWanted = false;
    addBubble("No pude acceder al micrófono. Revisa el permiso en tu navegador.", "in");
    return;
  }
  // Si soltó el dedo mientras se pedía el micrófono (o salió el permiso),
  // no arrancar: soltar la pista y no dejar nada corriendo.
  if (!recWanted) {
    stream.getTracks().forEach(function (t) { t.stop(); });
    return;
  }
  recStream = stream;
  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = function (e) { if (e.data.size) audioChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start(1000);
  isRecording = true;
  recSecs = 0;
  recTime.textContent = "0:00";
  inputEl.style.display = "none";
  sendBtn.style.display = "none";
  // Mientras el dedo está pegado, el botón se pone rojo: soltar envía.
  micBtn.classList.add("recording");
  micBtn.setAttribute("aria-label", "Grabando: toca de nuevo para enviar");
  recUi.classList.add("on");
  recStop.style.display = "";
  recTimer = setInterval(function () { recSecs++; recTime.textContent = fmtTime(recSecs); }, 1000);
}

function stopRecording() {
  recWanted = false; // el dedo se soltó: aunque el micrófono aún no arranque, no debe arrancar
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recTimer);
  recUi.classList.remove("on");
  micBtn.classList.remove("recording");
  micBtn.setAttribute("aria-label", "Grabar nota de voz");
  inputEl.style.display = "";
  syncMicSend();
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (recStream) { recStream.getTracks().forEach(function (t) { t.stop(); }); recStream = null; }
}

async function uploadAudio(blob) {
  var mime = blob.type || "audio/webm";
  var ext = mime.indexOf("mp4") !== -1 ? "mp4" : (mime.indexOf("ogg") !== -1 ? "ogg" : "webm");
  var id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + "." + ext;
  var res = await fetchTimeout(SUPABASE_URL + "/storage/v1/object/tata-audios/" + id, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": mime
    },
    body: blob
  });
  if (!res.ok) throw new Error("upload " + res.status);
  return SUPABASE_URL + "/storage/v1/object/public/tata-audios/" + id;
}

function addVoiceBubble(url, from) {
  var row = document.createElement("div");
  row.className = "msg-row " + from;
  var wrap = document.createElement("div");
  wrap.className = "bubble";
  var a = document.createElement("audio");
  a.className = "voice-note";
  a.controls = true;
  a.src = url;
  a.preload = "metadata";
  wrap.appendChild(a);
  var t = document.createElement("span");
  t.className = "msg-time";
  t.innerHTML = now() + (from === "out" ? '<span class="checks">✓✓</span>' : "");
  wrap.appendChild(t);
  row.appendChild(wrap);
  messagesEl.appendChild(row);
  scrollDown();
  return row;
}

async function transcribeAudio(blob) {
  var form = new FormData();
  form.append("file", blob, "nota." + (blob.type.indexOf("mp4") !== -1 ? "mp4" : "webm"));
  var res = await fetchTimeout(SUPABASE_URL + "/functions/v1/tata-stt", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY
    },
    body: form
  });
  if (!res.ok) throw new Error("stt " + res.status);
  var data = await res.json();
  return (data && data.text ? String(data.text).trim() : "");
}

async function onRecordingStop() {
  var blob = new Blob(audioChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || "audio/webm" });
  // Nota muy corta (menos de 2 segundos): no se sube, no se avanza, Tata invita a contar más.
  if (!blob.size || recSecs < 2) {
    waitingInput = true;
    setInputEnabled(true);
    if (blob.size) addBubble(decirMijo(pick(NOTA_CORTA)), "in");
    return;
  }
  var upRow = null;
  try { upRow = addBubble("Subiendo nota de voz…", "out"); } catch (e) {}
  try {
    var url = await uploadAudio(blob);
    upRow.remove();
    var voiceRow = addVoiceBubble(url, "out");
    var txRow = addBubble("Escuchando tu nota de voz…", "out");
    var transcript = "";
    try {
      transcript = await transcribeAudio(blob);
    } catch (e) { transcript = ""; }
    txRow.remove();
    // Si no se entendió nada, no se avanza: se queda en la misma pregunta.
    if (!transcript) {
      addBubble(decirMijo(pick(NO_ESCUCHE)), "in");
      waitingInput = true;
      setInputEnabled(true);
      return;
    }
    enviarOEncolar(transcript);
  } catch (e) {
    try { if (upRow) upRow.remove(); } catch (_e) {}
    addBubble("No pude subir la nota de voz. Intenta de nuevo.", "in");
    waitingInput = true;
    setInputEnabled(true);
  }
}

/* Tocar para grabar, tocar de nuevo para parar y enviar. Nada de dedo
   pegado: en navegadores dentro de apps (Instagram) el toque sostenido se
   interrumpía (touchcancel, gestos de la app) y la nota se cortaba. */
micBtn.addEventListener("click", function () {
  if (isRecording) stopRecording(); else startRecording();
});
micBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
recStop.addEventListener("click", stopRecording);
document.addEventListener("visibilitychange", function () {
  if (document.hidden && isRecording) stopRecording();
});
inputEl.addEventListener("input", syncMicSend);

sendBtn.addEventListener("click", onSend);
inputEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter") onSend();
});

/* Drenaje de la cola del guion: de a un mensaje por turno de Tata. */
setInterval(function () {
  if (MODO_MODELO || !guionCola.length || !waitingInput) return;
  if (!(telefonoMode || desahogoMode || extraState || !finished)) return;
  submitAnswer(guionCola.shift());
}, 700);

/* Guardián del chat libre: si el "escribiendo" lleva más de 60 s en un
   estado de chat libre, algo se trancó: se libera el input sí o sí. */
var typingDesde = 0;
setInterval(function () {
  if (typingRow) {
    if (!typingDesde) typingDesde = Date.now();
    if (Date.now() - typingDesde > 60000 && (desahogoMode || telefonoMode || extraState)) {
      hideTyping();
      typingDesde = 0;
      waitingInput = true;
      setInputEnabled(true);
    }
  } else typingDesde = 0;
}, 1000);

startConversation();
</script>
</body>
</html>
